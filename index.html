<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Amiibos</title>
    <!-- Bootstrap 5 CSS para los estilos de las tarjetas y modales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">Buscador de Amiibos</h1>
    
    <!-- Barra de búsqueda y botón general de favoritos -->
    <div class="row justify-content-center mb-4">
        <div class="col-md-6 d-flex gap-2">
            <input type="text" id="search-input" class="form-control" placeholder="Buscar Amiibo por nombre... (Ej. Mario)">
            <button id="fav-btn" class="btn btn-outline-danger">Favoritos</button>
        </div>
    </div>

    <!-- Animación de carga -->
    <div id="loader" class="text-center d-none my-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2 text-muted">Cargando Amiibos...</p>
    </div>
    
    <!-- Mensaje de error -->
    <div id="error-message" class="alert alert-danger d-none text-center" role="alert">
        Ocurrió un error al cargar los datos.
        <button id="reintentar-btn" class="btn btn-sm btn-danger ms-3">Reintentar</button>
    </div>

    <!-- Contenedor donde se renderizarán las tarjetas de JS -->
    <div id="cards-container" class="row g-4 justify-content-center">
        <!-- Las tarjetas se inyectarán aquí -->
    </div>
</div>

<!-- Modal para ver detalles -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Detalle del Amiibo</h5>
        <button type="button" id="closeModalBtn" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="detailModalBody">
        <!-- Contenido inyectado por JS -->
        <div id="modalContent" class="text-center"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" id="addFav" class="btn btn-danger">❤️ Añadir a Favoritos</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<!-- Bootstrap JS (necesario para el Modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Tu archivo JavaScript -->
<script src="/js/app.js"></script>
</body>
</html>
